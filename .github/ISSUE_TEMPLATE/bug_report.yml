name: Bug report
description: Report a reproducible problem with Fastisan
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug in Fastisan.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the problem.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the commands or steps needed to reproduce the issue.
      placeholder: |
        1. Run `fastisan init`
        2. Run `fastisan make:model User`
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: fastisan-version
    attributes:
      label: Fastisan version
      placeholder: "0.1.0"

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12.3"

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04"

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add logs, tracebacks, screenshots, or other useful information.