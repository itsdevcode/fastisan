name: Feature request
description: Suggest an improvement or new capability for Fastisan
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Fastisan.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation would this feature address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you would like to see.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example
      description: Show an example CLI command or generated output if applicable.
      placeholder: |
        fastisan make:schema User

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative approaches you considered.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context